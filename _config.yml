# Site settings
title: Rebecca & Ryan
email: nathan@nathanorick.com
url: https://firelotr.github.io/wedding_web # Be sure to include http:// or https://
description: "We're getting married and can't wait to celebrate with you!"
baseurl: ""
remote_theme: "cnorick/jekyll-theme-easy-wedding"
plugins:
  - jekyll-remote-theme

collections:
  stories:
    sort_by: order
  banners:

sass:
  style: compressed

defaults:
  - scope:
      path: "photos/"
    values:
      image: true
  - scope:
      type: banners
    values:
      layout: banner

# Build settings
markdown: kramdown
permalink: pretty

exclude:
  - _compress_images_cache.yml
